<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solar Fury — High-Performance TSL Background</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #050100;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .hero-overlay {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, transparent 25%, rgba(0, 0, 0, 0.5) 100%);
    }
    h1 {
      font-size: clamp(2.25rem, 6vw, 5.5rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 4px 30px rgba(255, 80, 0, 0.75);
      margin-bottom: 0.75rem;
    }
    p {
      font-size: clamp(0.95rem, 2vw, 1.3rem);
      max-width: 600px;
      color: rgba(255, 235, 210, 0.88);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: rgba(255, 90, 0, 0.22);
      border: 1px solid rgba(255, 140, 50, 0.55);
      color: #fff;
      padding: 0.65rem 1.35rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.2s ease, transform 0.2s ease;
    }
    button:hover {
      background: rgba(255, 110, 20, 0.42);
      transform: translateY(-1px);
    }
    .perf-badge {
      position: fixed;
      bottom: 12px;
      right: 14px;
      z-index: 2;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: rgba(255, 210, 170, 0.7);
      background: rgba(10, 4, 0, 0.65);
      border: 1px solid rgba(255, 120, 30, 0.25);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      pointer-events: none;
    }
  </style>

  <!-- FIX 1: Include "three/webgpu" in the importmap so three.tsl.js resolves its internal import -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.tsl.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hero-overlay">
    <h1>Helios Fury</h1>
    <p>Adaptive WebGPU / WebGL2 volumetric solar surface with distance-gated FBM and vectorized SIMD noise.</p>
    <div class="controls">
      <button id="toggle-uv">Toggle Ultraviolet Mode</button>
      <button id="toggle-quality">Quality: Auto-Adaptive</button>
    </div>
  </div>

  <div class="perf-badge" id="perf-badge">Initializing GPU...</div>

  <script type="module">
    import * as THREE from 'three';
    import {
      Fn, float, vec2, vec3, vec4,
      sin, cos, abs, fract, floor, dot, mix, clamp, max, exp, length, normalize, step,
      Loop, Break, If,
      screenUV, viewportResolution, time, uniform
    } from 'three/tsl';

    const container = document.getElementById('canvas-container');
    const perfBadge = document.getElementById('perf-badge');

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGPURenderer({
      antialias: false,
      powerPreference: 'high-performance'
    });

    let currentScale = isMobile ? 0.75 : Math.min(window.devicePixelRatio, 1.25);
    let adaptiveScaling = true;

    function updateRendererSize() {
      renderer.setPixelRatio(currentScale);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    }
    updateRendererSize();
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // Uniforms
    const uMouse = uniform(new THREE.Vector2(0, 0));
    const uUltraviolet = uniform(0.0);
    const uTimeScale = uniform(prefersReducedMotion ? 0.15 : 1.0);

    // ---------------------------------------------------------
    // 1. Vectorized SIMD Noise & Math Helpers in TSL
    // ---------------------------------------------------------

    const rand = (co) => fract(sin(dot(co, vec2(1.5977, 9.6226))).mul(43758.5453));

    // Vectorized 4-corner hash: computes 4 lattice points in parallel (SIMD vec4)
    const pn = Fn(([p_in]) => {
      const p = vec3(p_in).toVar();
      const i = floor(p).toVar();
      const f = fract(p).toVar();
      f.assign(f.mul(f).mul(float(3.0).sub(f.mul(2.0))));

      const n = i.x.add(i.y.mul(57.0)).add(i.z.mul(113.0));

      const h0 = fract(sin(vec4(n).add(vec4(0.0, 1.0, 57.0, 58.0))).mul(43758.5453));
      const h1 = fract(sin(vec4(n).add(vec4(113.0, 114.0, 170.0, 171.0))).mul(43758.5453));

      const hz = mix(h0, h1, f.z);
      const hy = mix(hz.xy, hz.zw, f.y);
      return mix(hy.x, hy.y, f.x);
    });

    // 3-Octave FBM (Only invoked near surface!)
    const fpn = Fn(([p_in]) => {
      const p = vec3(p_in);
      return pn(p.mul(0.06125)).mul(0.57)
        .add(pn(p.mul(0.125)).mul(0.28))
        .add(pn(p.mul(0.25)).mul(0.15));
    });

    const cosNoise = (p) => float(0.5).mul(sin(p.x).add(sin(p.y)));

    const rot2D = (p, a) => {
      const c = cos(a);
      const s = sin(a);
      return c.mul(p).add(s.mul(vec2(p.y, p.x.negate())));
    };

    const sdTorus = (p, t) => {
      const q = vec2(length(p.xz).sub(t.x.mul(1.2)), p.y);
      return length(q).sub(t.y);
    };

    const smin = (a, b, k) => {
      const h = clamp(float(0.5).add(float(0.5).mul(b.sub(a)).div(k)), 0.0, 1.0);
      return mix(b, a, h).sub(k.mul(h).mul(float(1.0).sub(h)));
    };

    // ---------------------------------------------------------
    // 2. Two-Phase Distance-Gated Solar Surface Map
    // ---------------------------------------------------------

    const sunSurface = Fn(([pos_in, animTime]) => {
      const pos = vec3(pos_in);
      const h = float(0.0).toVar();
      const q = pos.xz.mul(0.5).toVar();
      const s = float(0.5).toVar();

      Loop(5, () => {
        h.addAssign(s.mul(cosNoise(q)));
        q.assign(vec2(
          q.x.mul(1.36).add(q.y.mul(1.02)).add(2.41),
          q.x.mul(-1.02).add(q.y.mul(1.36)).add(8.13)
        ));
        s.mulAssign(float(0.48).add(float(0.2).mul(h)));
      });

      h.mulAssign(2.05);
      const d1 = pos.y.sub(h);

      // Coronal loops / magnetic rings
      const rawMod = pos.add(3.3).mul(0.1);
      const r1 = rawMod.sub(floor(rawMod)).mul(10.0).sub(5.0).toVar();
      r1.y.assign(
        pos.y.sub(0.1).sub(h.mul(0.7)).add(
          float(0.5).mul(sin(animTime.mul(3.0).add(pos.x).add(pos.z.mul(3.0))))
        )
      );

      const c = cos(pos.x);
      const rxz = c.mul(r1.xz).add(vec2(r1.z, r1.x.negate()));
      r1.x.assign(rxz.x);
      r1.z.assign(rxz.y);

      const ratio = clamp(abs(pos.x.div(pos.z.add(0.0001))), 0.7, 2.5);
      const d2 = sdTorus(vec3(r1.x, r1.z, r1.y), vec2(ratio, 0.20));

      return smin(d1, d2, float(1.0));
    });

    const map = Fn(([p_in, animTime]) => {
      const p = vec3(p_in).toVar();
      p.z.addAssign(1.0);

      // FIX 2: Avoid multi-component swizzle .assign() (e.g. p.yz.assign)
      // Assign individual channels instead so WGSL/GLSL builders succeed
      const ryz = rot2D(vec2(p.y, p.z), float(-25.5).add(uMouse.y.mul(0.35)));
      p.y.assign(ryz.x);
      p.z.assign(ryz.y);

      const rxz = rot2D(vec2(p.x, p.z), uMouse.x.mul(1.5).add(animTime.mul(0.1)));
      p.x.assign(rxz.x);
      p.z.assign(rxz.y);

      // PHASE 1: Evaluate cheap geometric base distance
      const dBase = sunSurface(p, animTime).toVar();

      // PHASE 2: Distance-Gated FBM!
      If(dBase.lessThan(0.65), () => {
        dBase.addAssign(fpn(p.mul(50.0).add(animTime.mul(25.0))).mul(0.45));
      });

      return dBase;
    });

    // ---------------------------------------------------------
    // 3. Pre-folded Physical Blackbody Palette
    // ---------------------------------------------------------

    const firePalette = (i) => {
      const T = float(1400.0).add(float(1300.0).mul(i));
      const L5 = vec3(22190.066, 5507.317, 1649.162);
      const L = vec3(7.4, 5.6, 4.4);
      const denom = L5.mul(exp(float(143876.72).div(L.mul(T))).sub(1.0));
      return vec3(1.0).sub(exp(vec3(-5e8).div(denom)));
    };

    // ---------------------------------------------------------
    // 4. Main Volumetric Raymarcher (44 Steps + Smart Early Exit)
    // ---------------------------------------------------------

    const solarFuryShader = Fn(() => {
      const animTime = time.mul(uTimeScale);
      // Flip Y so orientation matches Shadertoy
      const uv = vec2(screenUV.x, float(1.0).sub(screenUV.y));
      const aspect = viewportResolution.x.div(viewportResolution.y);
      const centered = vec2(uv.x.sub(0.5).mul(aspect), uv.y.sub(0.5));

      const rd = normalize(vec3(centered.x, centered.y, 1.0));
      const ro = vec3(0.0, 0.0, -22.0);

      const ld = float(0.0).toVar();
      const td = float(0.0).toVar();
      const w  = float(0.0).toVar();
      const d  = float(1.0).toVar();
      const t  = float(1.0).toVar();

      const h = float(0.1);
      const tc = float(0.0).toVar();
      const seed = uv.add(fract(animTime));

      Loop(44, ({ i }) => {
        If(
          td.greaterThan(0.985)
            .or(d.lessThan(t.mul(0.0012)))
            .or(t.greaterThan(38.0)),
          () => {
            Break();
          }
        );

        d.assign(map(ro.add(rd.mul(t)), animTime));

        ld.assign(h.sub(d).mul(step(d, h)));
        w.assign(float(1.0).sub(td).mul(ld));

        tc.addAssign(w.mul(w).add(1.0 / 42.0));
        td.addAssign(w.add(1.0 / 165.0));

        const iFloat = float(i).add(1.0);
        const jitter = rand(seed.mul(iFloat)).mul(0.28);
        const baseFactor = mix(float(0.8), float(1.0), uUltraviolet);

        d.assign(abs(d).mul(baseFactor.add(jitter)));
        d.assign(max(d, 0.048));

        t.addAssign(d.mul(0.52));
      });

      const finalColor = firePalette(tc).toVar();

      const uvBoost = float(1.0).div(exp(ld.mul(2.82))).mul(1.05);
      finalColor.assign(mix(finalColor, finalColor.mul(uvBoost), uUltraviolet));

      return vec4(finalColor, 1.0);
    });

    // ---------------------------------------------------------
    // 5. Scene Setup, Lifecycle & Auto-Adaptive Resolution
    // ---------------------------------------------------------

    const material = new THREE.MeshBasicNodeMaterial();
    material.colorNode = solarFuryShader();

    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(quad);

    const targetMouse = new THREE.Vector2(0, 0);
    window.addEventListener('pointermove', (e) => {
      targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }, { passive: true });

    let isUV = false;
    const uvBtn = document.getElementById('toggle-uv');
    uvBtn.addEventListener('click', () => {
      isUV = !isUV;
      uUltraviolet.value = isUV ? 1.0 : 0.0;
      uvBtn.textContent = isUV ? 'Standard Blackbody Mode' : 'Toggle Ultraviolet Mode';
    });

    const qualityBtn = document.getElementById('toggle-quality');
    qualityBtn.addEventListener('click', () => {
      if (adaptiveScaling) {
        adaptiveScaling = false;
        currentScale = Math.min(window.devicePixelRatio, 1.5);
        qualityBtn.textContent = 'Quality: Locked High';
      } else {
        adaptiveScaling = true;
        qualityBtn.textContent = 'Quality: Auto-Adaptive';
      }
      updateRendererSize();
    });

    window.addEventListener('resize', updateRendererSize, { passive: true });

    let isTabVisible = true;
    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
    });

    let frameCount = 0;
    let lastCheck = performance.now();

    async function init() {
      try {
        await renderer.init();
        const backendName = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2 Fallback';

        renderer.setAnimationLoop((now) => {
          if (!isTabVisible) return;

          frameCount++;
          const elapsed = now - lastCheck;

          if (elapsed >= 500) {
            const fps = Math.round((frameCount * 1000) / elapsed);

            if (adaptiveScaling) {
              if (fps < 48 && currentScale > 0.55) {
                currentScale = Math.max(0.55, +(currentScale - 0.1).toFixed(2));
                updateRendererSize();
              } else if (fps > 58 && currentScale < (isMobile ? 1.0 : 1.25)) {
                currentScale = Math.min(isMobile ? 1.0 : 1.25, +(currentScale + 0.05).toFixed(2));
                updateRendererSize();
              }
            }

            perfBadge.textContent = `${backendName} | ${fps} FPS | Scale: ${Math.round(currentScale * 100)}%`;
            frameCount = 0;
            lastCheck = now;
          }

          uMouse.value.lerp(targetMouse, 0.05);
          renderer.render(scene, camera);
        });
      } catch (err) {
        console.error('Shader/Renderer initialization error:', err);
        perfBadge.textContent = `Error: ${err.message || err}`;
      }
    }

    init();
  </script>
</body>
</html>
